<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2f78" />
    <meta
      name="description"
      content="Agendae — agendamentos e gestão de filas para negócios que cuidam do tempo das pessoas."
    />
    <title>Agendae — Encontre e agende seu atendimento</title>
    <link rel="icon" type="image/png" href="./public/imagens/logo_agendae.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./professional.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    <script>
      (function (location) {
        if (location.search.startsWith("?/")) {
          var restored = location.search.slice(2).split("&").map(function (part) {
            return part.replace(/~and~/g, "&");
          }).join("?");
          var separator = restored.indexOf("?");
          var route = separator === -1 ? restored : restored.slice(0, separator);
          var query = separator === -1 ? "" : restored.slice(separator + 1);
          var params = new URLSearchParams(query);
          params.set("route", route);
          var ordered = new URLSearchParams();
          ordered.set("route", params.get("route"));
          params.forEach(function (value, key) {
            if (key !== "route") ordered.append(key, value);
          });
          history.replaceState(null, "", location.pathname + "?" + ordered.toString() + location.hash);
        }
      })(window.location);
    </script>
    <script src="./vendor/qrcode.min.js"></script>
    <script type="module" src="./professional.js"></script>
  </body>
</html>
