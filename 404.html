<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agendae</title>
    <link rel="icon" type="image/png" href="./public/imagens/logo_agendae.png" />
    <script>
      (function (location) {
        var projectSegments = 1;
        var base = location.pathname.split("/").slice(0, 1 + projectSegments).join("/");
        var route = location.pathname.split("/").slice(1 + projectSegments).join("/");
        var params = new URLSearchParams(location.search);
        params.set("route", route);
        var ordered = new URLSearchParams();
        ordered.set("route", params.get("route"));
        params.forEach(function (value, key) {
          if (key !== "route") ordered.append(key, value);
        });
        location.replace(location.protocol + "//" + location.host + base + "/?" + ordered.toString() + location.hash);
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
